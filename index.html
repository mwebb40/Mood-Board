<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasonal Mood Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="masthead">
    <h1>Seasonal Mood Board</h1>
    <div class="rule-thin"></div>
    <div class="meta" id="meta-line">Spring &middot; 5 images</div>
    <div class="meta season-picker">
      <label for="season-select">Season</label>
      <select id="season-select">
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
        <option value="autumn">Autumn</option>
        <option value="winter">Winter</option>
      </select>
    </div>
  </div>

  <div class="section-label" id="section-label">Spring</div>
  <div class="rule"></div>
  <div class="grid" id="gallery"></div>

  <script src="js/app.js"></script>
</body>
</html>
