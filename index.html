<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Phases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="masthead">
    <h1>The Phases</h1>
    <div class="rule-thin"></div>
    <div class="meta" id="meta-line">Bleak Midwinter &middot; 3 images</div>
    <div class="meta season-picker">
      <label for="phase-select">Phase</label>
      <select id="phase-select">
        <option value="bleak-midwinter">Bleak Midwinter</option>
        <option value="late-winter">Late Winter</option>
        <option value="early-spring">Early Spring</option>
        <option value="warm-up">The Warm Up</option>
        <option value="high-summer">High Summer</option>
        <option value="early-autumn">Early Autumn</option>
        <option value="late-autumn">Late Autumn</option>
        <option value="festive">Festive</option>
        <option value="gooch">Gooch</option>
      </select>
    </div>
  </div>

  <div class="section-label" id="section-label">Bleak Midwinter</div>
  <div class="rule"></div>
  <div class="grid" id="gallery"></div>

  <script src="js/app.js"></script>
</body>
</html>
